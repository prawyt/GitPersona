[package]
name = "gitpersona"
version = "0.5.0"
edition = "2024"
description = "A safety-first local GitHub identity manager"
license = "MIT"
rust-version = "1.85"

[workspace]
members = ["desktop/src-tauri"]
resolver = "2"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dialoguer = "0.12"
directories = "6.0"
fs2 = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
toml = "0.9"
url = "2.5"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
