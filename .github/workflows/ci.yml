name: CI

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  consume-run-ci:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove one-shot CI label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --method DELETE
          "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/run-ci"

  test:
    needs: consume-run-ci
    if: >-
      always() &&
      (github.event_name == 'push' ||
      needs.consume-run-ci.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf
      - run: npm ci
        working-directory: desktop
      - run: npm run lint
        working-directory: desktop
      - run: npm run format:check
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Audit npm dependencies
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if ! grep -q 'audit endpoint returned an error' <<<"$out"; then
              echo "npm audit reported vulnerabilities at or above the high threshold."
              exit 1
            fi
            echo "npm audit registry endpoint unavailable (attempt $attempt of 3)."
            sleep $((attempt * 15))
          done
          echo "npm audit registry endpoint stayed unreachable after 3 attempts."
          exit 1
      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - run: npm run tauri build -- --no-bundle
        working-directory: desktop
