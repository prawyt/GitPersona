name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: GitPersona v__VERSION__
          releaseDraft: true
          prerelease: false
      - name: Prepare portable Windows executable
        id: portable-windows
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $name = "GitPersona_${version}_windows_x86_64.exe"
          Copy-Item target/release/gitpersona-desktop.exe "target/release/$name"
          $checksum = "$name.sha256"
          $hash = (Get-FileHash "target/release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "target/release/$checksum" -NoNewline
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
      - name: Upload portable Windows executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload
          "v${{ steps.portable-windows.outputs.version }}"
          "target/release/${{ steps.portable-windows.outputs.name }}"
          "target/release/${{ steps.portable-windows.outputs.checksum }}"
          --clobber
      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitpersona-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
